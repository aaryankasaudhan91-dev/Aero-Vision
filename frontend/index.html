<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  
  <!-- Security & Force HTTPS -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <script>
    if (window.location.protocol === 'http:' && 
        window.location.hostname !== 'localhost' && 
        window.location.hostname !== '127.0.0.1' && 
        !window.location.hostname.startsWith('192.168.')) {
      window.location.href = window.location.href.replace('http:', 'https:');
    }
  </script>

  <!-- Performance Preconnect Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://unpkg.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Meta Title, Description, and SEO -->

  <meta name="description" content="National-scale geospatial atmospheric analytics platform for India. Real-time CPCB ground monitoring, Sentinel-5P TROPOMI formaldehyde (HCHO) hotspot detection, NASA FIRMS active fire correlation, and ML-driven surface AQI predictions." />
  <meta name="keywords" content="AeroVision, Air Quality India, Surface AQI, HCHO Hotspots, Sentinel-5P, TROPOMI, CPCB Stations, NASA FIRMS, ISRO SAC, Atmospheric Dispersion, FourCastNet, Weather Dynamics" />
  <meta name="author" content="Project AeroVision Research Team" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://aerovision.in/" />
