<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="globeGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Globe / Subcontinent Disc -->
  <circle cx="32" cy="32" r="26" fill="url(#globeGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Atmospheric Aura -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.4" />

  <!-- Geostationary Orbit Arc 1 -->
  <ellipse cx="32" cy="32" rx="28" ry="12" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="80 15" transform="rotate(-30 32 32)" filter="url(#glow)" />

  <!-- Atmospheric Density Isobars -->
  <path d="M14 30 C 22 24, 38 36, 50 28" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <path d="M16 38 C 26 32, 38 44, 48 38" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />

  <!-- Satellite Transponder Node -->
  <circle cx="48" cy="18" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" filter="url(#glow)" />
  <circle cx="48" cy="18" r="6" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />

  <!-- Central Air Quality Core -->
  <circle cx="32" cy="32" r="3.5" fill="#10b981" />
  <circle cx="32" cy="32" r="6.5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5" />
</svg>
